server:
  address: 127.0.0.1
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:h2:file:./data/proposals;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jackson:
    serialization:
      write-dates-as-timestamps: false
camunda:
  bpm:
    webapp:
      index-redirect-enabled: false
    admin-user:
      id: demo
      password: ${CAMUNDA_ADMIN_PASSWORD:demo-local-only}
      first-name: Demo
    filter:
      create: Semua tugas demo
    history-level: full
    auto-deployment-enabled: true
    deployment-resource-pattern: classpath*:/processes/*.bpmn
    database:
      schema-update: true
    job-execution:
      enabled: false
    generic-properties:
      properties:
        history-cleanup-enabled: false
logging:
  level:
    org.camunda.bpm: INFO
